<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PAE Proposals{% endblock %}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    background: #12141a;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
      sans-serif;
    line-height: 1.5;
  }
  a { color: #7db8ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2 { font-weight: 600; }
  h1 a { color: inherit; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #2a2d36; }
  th { color: #9aa0ab; font-weight: 500; font-size: 0.85rem; text-transform: uppercase; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .tabs a { padding: 0.4rem 0.9rem; border-radius: 6px; background: #1c1f27; color: #c7cbd4; }
  .tabs a.active { background: #2f6fed; color: #fff; }
  .badge { padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; }
  .badge.ready { background: #1f4d2e; color: #7ee29a; }
  .badge.not-ready { background: #3a2f1a; color: #e0b96a; }
  pre { background: #1c1f27; padding: 1rem; border-radius: 8px; overflow-x: auto; }
  .spark rect { fill: #7db8ff; }
  form.inline { display: inline-block; margin-right: 0.75rem; }
  button, input[type=text] {
    font: inherit;
    border-radius: 6px;
    border: 1px solid #383c47;
    background: #1c1f27;
    color: #e6e6e6;
    padding: 0.4rem 0.7rem;
  }
  button.approve { background: #1f4d2e; border-color: #2f6f43; }
  button.reject { background: #4d1f24; border-color: #6f2f36; }
  .card {
    background: #171a21;
    border: 1px solid #262a33;
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .muted { color: #9aa0ab; }
</style>
</head>
<body>
<h1><a href="/proposals">PAE Proposals</a></h1>
{% block content %}{% endblock %}
</body>
</html>
